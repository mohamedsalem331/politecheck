[tool.poetry]
name = "politecheck"
version = "0.1.0"
description = "a RESTful service that leverages Tisane Labs' AI-powered NLP models..."
authors = ["Mohamed Salem"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12"
pyramid = ">=2.0.2,<3.0.0"
gunicorn = ">=20.1,<21.0"
marshmallow = ">=4.0.0,<5.0.0"
injector = ">=0.22.0,<0.23.0"
structlog = ">=25.3.0,<26.0.0"
pytz = ">=2025.2,<2026.0"
waitress = ">=3.0.0,<4.0.0"
pyramid_services = ">=2.1,<3.0"
pyyaml = ">=6.0.1,<7.0.0"
requests = ">=2.31.0,<3.0.0"
redis = ">=5.0.0,<6.0.0"

[tool.poetry.scripts]
politecheck = "politecheck:main"

[tool.poetry.plugins."paste.app_factory"]
main = "politecheck:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-mock = "^3.14.0"
coverage = "^7.8.0"
black = "^23.7"
isort = "^5.12"
flake8 = "^6.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"