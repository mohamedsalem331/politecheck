[project]
name = "politecheck"
version = "0.1.0"
description = "a RESTful service that leverages Tisane Labs’ AI-powered NLP models to detect and classify harmful content such as cyberbullying, online harassment, hate speech, and abusive language in text."
authors = [
    {name = "Mohamed Salem"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyramid (>=2.0.2,<3.0.0)",
    "gunicorn (>=20.1,<21.0)",
    "marshmallow (>=4.0.0,<5.0.0)",
    "injector (>=0.22.0,<0.23.0)",
    "structlog (>=25.3.0,<26.0.0)"
]

[tool.poetry.scripts]
politecheck = "politecheck:main" # This is for direct execution via 'poetry run politecheck'

[tool.poetry.plugins."paste.app_factory"]
main = "politecheck:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-mock = "^3.14.0"
coverage = "^7.8.0"
waitress = "^3.0.2"

