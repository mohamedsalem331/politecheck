apiVersion: v1
kind: Secret
metadata:
  name: {{ include "politecheck.fullname" . }}-secrets
  labels:
    {{- include "politecheck.labels" . | nindent 4 }}
type: Opaque
data:
  # Tisane API Key (base64 encoded)
  TISANE_API_KEY: {{ .Values.tisane.apiKey | b64enc | quote }}
  
  # Redis password (if provided)
  {{- if .Values.redis.auth.enabled }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | b64enc | quote }}
  {{- end }}
  
  # Application secret key for sessions/tokens
  APP_SECRET_KEY: {{ .Values.backend.secretKey | default (randAlphaNum 32) | b64enc | quote }} 