# development.ini Configure app behavior
[app:main]
use = egg:politecheck#main
pyramid.reload_templates = true
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en

# Add your dependency injection configuration here
# Example:
# pyramid.includes = pyramid_services
# services.registrations = politecheck.services

[server:main]
use = egg:waitress#main
listen = localhost:6543

[loggers]
keys = root, request, politecheck

[handlers]
keys = console

[formatters]
keys = json

[logger_root]
level = INFO
handlers = console

[logger_request]
level = INFO
handlers = console
qualname = request
propagate = 0

[logger_politecheck]
level = INFO
handlers = console
qualname = politecheck
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = INFO
formatter = json

[formatter_json]
class = politecheck.logging.formatters.StructuredJsonFormatter