# Tisane API Configuration
tisane:
  apiKey: ".."
  baseUrl: "https://api.tisane.ai/parse"

# Backend API Configuration
backend:
  replicaCount: 2
  
  # Docker image configuration
  # Before deploying, build the image using: ./scripts/build-docker.sh
  # For local development: docker build -t politecheck:latest .
  image:
    repository: politecheck
    pullPolicy: IfNotPresent
    tag: "latest"
  
  # This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets: []
  
  # Application secret key (will be auto-generated if not provided)
  secretKey: ""
  
  logging:
    level: "INFO"
  
  serviceAccount:
    create: true
    automount: true
    annotations: {}
    name: ""
  
  podAnnotations: {}
  podLabels:
    app.kubernetes.io/name: "politecheck"
    app.kubernetes.io/instance: "politecheck"
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: "Helm"
    app.kubernetes.io/component: "backend"
    app.kubernetes.io/part-of: "politecheck"
    app.kubernetes.io/created-by: "Helm"
  
  podSecurityContext: {}
  
  securityContext:
    runAsUser: 1000
  
  service:
    type: ClusterIP
    port: 8002
  
  ingress:
    enabled: false
    className: ""
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local
  
  
  # This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  
  volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false
  
  # Additional volumeMounts on the output Deployment definition.
  volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true
  
  nodeSelector: {}
  
  tolerations: []
  
  affinity: {}

# Redis Configuration (Bitnami Redis Chart)
redis:
  enabled: true
  
  # Redis architecture
  architecture: standalone
  
  # Redis authentication
  auth:
    enabled: false
    sentinel: false
  
  # Redis master configuration
  master:
    persistence:
      enabled: true
      storageClass: ""
      size: 1Gi
      accessModes:
        - ReadWriteOnce
    
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
    
    # Redis configuration
    configuration: |-
      maxmemory 256mb
      maxmemory-policy allkeys-lru
      appendonly yes
    
    # Security context
    securityContext:
      enabled: true
      runAsUser: 1001
      fsGroup: 1001
    
    # Pod security context
    podSecurityContext:
      enabled: true
      fsGroup: 1001
    
    nodeSelector: {}
    tolerations: []
    affinity: {}
  
  service:
    type: ClusterIP
    port: 6379
  
  # Redis metrics (optional)
  metrics:
    enabled: false
